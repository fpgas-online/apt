<p>Debian packages for <a href="https://fpgas.online">fpgas.online</a>, the
FPGA-as-a-Service platform: installed on its network-booted Raspberry Pi nodes.
Every package is architecture <code>all</code>. Packages are pulled from their
source repositories' GitHub Releases every 15 minutes (see
<a href="https://github.com/fpgas-online/apt">fpgas-online/apt</a>).</p>
