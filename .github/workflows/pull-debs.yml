name: Pull debs from source repos

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: "republish the apt repository even when no new debs were pulled"
        type: boolean
        default: false

permissions:
  contents: write
  # Needed to dispatch publish.yml below: GITHUB_TOKEN pushes never trigger
  # other workflows on their own, so we trigger it explicitly.
  actions: write

concurrency:
  group: apt-repo-writes
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Pull new debs
        id: pull
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          uv run --python 3.12 python tools/pull_debs.py | tee pull.log || rc=$?
          n="$(grep -E '^NEW: [0-9]+$' pull.log | tail -1 | awk '{print $2}')"
          echo "new=${n:-0}" >> "$GITHUB_OUTPUT"
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        id: commit
        if: steps.pull.outputs.new != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A pool
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Pull $(git status --porcelain pool/ | grep -c '^A') new deb(s) from source repos"
            # Retry the push: a GitHub server error here (HTTP 500 at 16:50Z on
            # 2026-10-07, run 37655202595) otherwise loses the pull until the
            # next scheduled start, which GitHub runs hours apart, and builds
            # that install from this repo meanwhile get stale debs (#22).
            # Rebase between tries in case a publish commit landed meanwhile.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push; then pushed=true; break; fi
              [ "$attempt" = 5 ] && break
              echo "push attempt ${attempt} failed; retrying in $((attempt * 20)) s"
              sleep $((attempt * 20))
              # A failed pull (network) or conflict must not end the retries
              # under bash -e: abort a half-done rebase and push again.
              git pull --rebase origin main || git rebase --abort || true
            done
            if [ "$pushed" != true ]; then
              echo "::error::push failed 5 times; the pulled debs are not published"
              exit 1
            fi
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the apt repository
        if: steps.commit.outputs.pushed == 'true' || github.event.inputs.force_update == 'true'
        # A push made with the default GITHUB_TOKEN never triggers other
        # workflows (GitHub's anti-recursion rule), so publish.yml's `push`
        # trigger won't fire for the commit above -- dispatch it explicitly.
        # publish.yml indexes, signs and deploys (mithro/apt-repo-action).
        env:
          GH_TOKEN: ${{ github.token }}
        # Retried for the same reason as the push (#22).
        run: |
          for attempt in 1 2 3 4 5; do
            gh workflow run publish.yml --ref main && exit 0
            [ "$attempt" = 5 ] && break
            echo "dispatch attempt ${attempt} failed; retrying in $((attempt * 20)) s"
            sleep $((attempt * 20))
          done
          echo "::error::could not dispatch publish.yml 5 times"
          exit 1

      - name: Fail the run if any source repo errored
        run: exit "${{ steps.pull.outputs.rc }}"
