name: Publish apt repository

# pool/main/ is the package store (pull-debs.yml and receive-deb.yml add to
# it). Every package in it is Architecture: all and installs on both NFS-root
# releases, so each suite gets the whole pool; the shared workflow indexes,
# signs and deploys one flat repository per suite, the same as every other
# apt repository (docs/conventions.md in mithro/apt-repo-action).
#
# The shared workflow also bundles what the pool's packages depend on from
# the dependency repositories .github/apt-packaging.toml declares: the
# compiled LitePCIe driver packages from fpgas.online-test-designs' archive,
# each suite's from that archive's same suite. Those are the only
# architecture-dependent packages served here. refresh-bundled.yml starts
# this workflow when that archive has something newer.

on:
  push:
    branches: [main]
    paths: [pool/**, packaging/apt-intro.html, .github/workflows/publish.yml]
  # pull-debs.yml and receive-deb.yml dispatch this after committing to pool/:
  # a GITHUB_TOKEN push never triggers other workflows by itself.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [bookworm, trixie]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.suite }}-all
          path: pool/main/*.deb
          if-no-files-found: error

  publish:
    needs: collect
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "bookworm trixie"
      # Informational only: each suite is a flat repository with one Packages
      # file, and apt does not check its host architecture against a flat
      # Release, so amd64 and any other architecture install the Architecture:
      # all packages too (fpgas-online/apt#12; the old dists/ layout's
      # per-architecture binary-*/ indexes are what shut other hosts out).
      # amd64: the bundled LitePCIe tools are built for it as well.
      architectures: "all amd64 arm64 armhf"
      description: "Debian packages for the fpgas.online FPGA-as-a-Service platform"
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
